name: Deploy Starlight

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # Legacy Pages is still configured to build from main/README on some repos.
  # That job can overwrite the Starlight artifact; redeploy when it finishes.
  workflow_run:
    workflows:
      - "pages-build-deployment"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify publication safety
        run: bash scripts/verify-publication-safe.sh src/content/docs

      - name: Verify Starlight frontmatter
        run: bash scripts/ensure-starlight-frontmatter.sh src/content/docs

      - name: Check markdown links
        run: npm run check:links

      - name: Build site
        run: npm run build

      - name: Add custom domain
        run: cp CNAME dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Legacy Pages still builds from main/README and can finish after deploy.
  redeploy-after-legacy:
    environment:
      name: github-pages
      url: ${{ steps.redeployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'
    steps:
      - name: Wait for legacy Pages build
        run: sleep 90

      - name: Redeploy Starlight
        id: redeployment
        uses: actions/deploy-pages@v4
