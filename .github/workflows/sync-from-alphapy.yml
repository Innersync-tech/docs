name: Sync Alphapy docs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4
        with:
          path: central-docs

      - name: Checkout bryntje/alphapy
        uses: actions/checkout@v4
        with:
          repository: bryntje/alphapy
          path: alphapy

      - name: Sync alphapy docs
        run: |
          rsync -av --delete alphapy/docs/ central-docs/src/content/docs/alphapy/ \
            --exclude=terms-of-service.md \
            --exclude=privacy-policy.md \
            --exclude=pricing.md \
            --exclude=legal.md \
            --exclude=_config.yml \
            --exclude=CNAME

      - name: Commit and push
        working-directory: central-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/alphapy/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: sync alphapy docs from bryntje/alphapy"
          git push
